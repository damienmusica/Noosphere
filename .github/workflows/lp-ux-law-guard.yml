# 판결 트립와이어 2 (2026-08-30, CPO 전면 수용): 반응 입법 방지.
# LP 상호작용-법(grammar.ts)을 바꾸는 PR 은 본문에 대안 비교 링크가 있어야 한다.
# "대안비교: 없음" 인 채로 grammar.ts 를 만지면 빨강 — 느낌이 아니라 CI 다.
name: lp-ux-law-guard
on:
  pull_request:
    paths:
      - "literary-planet/src/universe/grammar.ts"
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: require alternative-comparison link
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$BODY" | grep -q "대안비교: 없음"; then
            echo "::error::grammar.ts 를 바꾸면서 대안 비교가 '없음'이다 — 판결 §5-1 위반(반응 입법). PR 본문의 '대안비교:'에 비교 문서/판정 링크를 달아라."
            exit 1
          fi
          if ! echo "$BODY" | grep -q "대안비교:"; then
            echo "::error::PR 본문에 '대안비교:' 항목이 없다 — 템플릿을 지우지 마라."
            exit 1
          fi
          echo "대안 비교 링크 확인."
